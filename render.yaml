# Blueprint de infraestrutura do AetherTable (Render).
#
# Sobe os DOIS serviços Node do projeto no plano gratuito. O frontend NÃO está
# aqui: ele vai para a Vercel, que serve Next.js melhor e sem hibernação.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ O QUE O PLANO GRATUITO CUSTA                                            │
# │                                                                         │
# │ Serviço free hiberna após ~15 min sem tráfego. Isso NÃO derruba partida │
# │ em andamento — o patch de 20 Hz mantém o serviço acordado. O custo é a  │
# │ PRIMEIRA conexão depois de ocioso: ~50 s de cold start.                 │
# │                                                                         │
# │ O frontend trata isso mostrando "acordando o servidor" e repetindo a    │
# │ conexão; ver apps/frontend/src/net/wake.ts.                             │
# │                                                                         │
# │ Para eliminar a hibernação, suba os dois serviços para o plano Starter. │
# │ Nada mais no arquivo muda.                                             │
# └─────────────────────────────────────────────────────────────────────────┘
#
# O banco NÃO é criado aqui de propósito: o Postgres gratuito do Render expira.
# Use um projeto Neon (gratuito e permanente) e cole a connection string em
# DATABASE_URL. Ver docs/deploy_gratuito.md.

services:
  # ─── API Core (NestJS) ────────────────────────────────────────────────────
  - type: web
    name: aethertable-api
    runtime: docker
    dockerfilePath: ./apps/backend-core/Dockerfile
    # O contexto é a RAIZ: o build precisa do lockfile e dos manifests de todos
    # os workspaces para resolver as dependências.
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production

      # Cole a connection string POOLED do Neon (o host com "-pooler").
      # A direta esgota conexões: o Prisma abre um pool por instância.
      - key: DATABASE_URL
        sync: false

      # Precisa ser IDÊNTICO ao do game-server. `generateValue` cria um segredo
      # forte uma vez; copie o valor gerado para o outro serviço.
      - key: JWT_SECRET
        generateValue: true

      # Vida do access token, em segundos. ATENÇÃO: este valor passou a ser LIDO
      # de verdade (auth/ttl.ts). Antes era decorativo — o módulo assinava com
      # '7d' fixo e ninguém olhava aqui.
      #
      # 86400 = 24 h. NÃO baixe enquanto não existir rota de refresh: o jogador
      # seria deslogado no meio da partida, sem nada que renove a sessão. Era
      # exatamente o que este campo dizia quando valia 900 (15 min), e
      # felizmente ninguém o lia na época.
      - key: JWT_ACCESS_TTL
        value: '86400'
      # `JWT_REFRESH_TTL` foi removido: não existe refresh token no sistema, e
      # variável que finge configurar algo é pior que variável ausente — leva
      # quem audita a concluir que há uma rotação de sessão que não há.

      # Origem do frontend na Vercel. Com credentials: true o navegador rejeita
      # curinga — precisa ser a origem exata.
      - key: CORS_ORIGINS
        sync: false

      # Obrigatório pela Scryfall: sem User-Agent identificável eles bloqueiam.
      - key: SCRYFALL_USER_AGENT
        sync: false

      # Para onde devolver o navegador depois do OAuth. Sem isto cai na
      # primeira origem de CORS_ORIGINS, que é um palpite razoável mas implícito.
      - key: FRONTEND_URL
        sync: false

      # Segredo das rotas máquina-a-máquina. `GET /api/v1/internal/decks/:id`
      # devolve o decklist completo sem checar dono — é o que o game-server
      # precisa para provisionar a partida.
      #
      # EM PRODUÇÃO A ROTA FECHA SEM ESTE VALOR (internal-api.guard.ts). Sem
      # ele no blueprint, o deploy subia e NENHUM deck era provisionado: a mesa
      # abria vazia, sem erro visível ao jogador. Precisa ser IDÊNTICO ao do
      # game-server.
      - key: INTERNAL_API_TOKEN
        generateValue: true

      # Voz (LiveKit). `getVoiceToken` cai em 'devkey'/'secret' quando ausente:
      # o token é emitido, o cliente tenta conectar e falha na autenticação do
      # LiveKit — um "microfone não funciona" sem nenhuma pista da causa.
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false

      # Backoffice (DOC-061). Contas que devem ser ADMIN, separadas por vírgula.
      # `sync: false` porque é dado de identidade e não deve ficar no repositório
      # — preencha no painel do Render.
      #
      # SEM ISTO O PAINEL /admin FICA INALCANÇÁVEL: toda rota que promove alguém
      # a ADMIN exige um ADMIN autenticado, e numa base nova ninguém é. A API
      # reconcilia esta lista a cada boot.
      - key: ADMIN_EMAILS
        sync: false

  # ─── Game server (Colyseus) ───────────────────────────────────────────────
  - type: web
    name: aethertable-game
    runtime: docker
    dockerfilePath: ./apps/game-server/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # MESMO valor do JWT_SECRET da API. Segredos diferentes produzem
      # "Invalid seat token" no handshake e a mesa nunca abre.
      - key: JWT_SECRET
        sync: false

      # Nó único: sem Redis. Presence e driver do Redis só são necessários para
      # descoberta de sala ENTRE nós, e o plano gratuito é de um nó só.
      - key: USE_REDIS
        value: 'false'

      - key: BACKEND_CORE_URL
        fromService:
          name: aethertable-api
          type: web
          property: host

      - key: PUBLIC_WS_URL
        sync: false

      # MESMO valor do INTERNAL_API_TOKEN da API. Sem ele o provisionamento de
      # deck recebe 401 e a partida começa com o grimório vazio.
      - key: INTERNAL_API_TOKEN
        sync: false

      # Basic auth de /colyseus e /metrics. SEM ELA O PROCESSO NAO SOBE em
      # producao, e a recusa e deliberada: o monitor lista todas as salas e
      # permite inspecionar o estado — inclusive a mao e o grimorio dos
      # jogadores. E o unico caminho do sistema que contorna `podeVer`.
      - key: ADMIN_PANEL_PASSWORD
        generateValue: true

      # MESMO valor do CORS_ORIGINS da API — a origem do frontend.
      #
      # O game-server passou a servir `GET /salas`, a vitrine de mesas públicas,
      # e ela é a PRIMEIRA rota deste processo chamada por `fetch` de outra
      # origem (o WebSocket não precisa de CORS, e /health e /metrics são
      # consumidos por máquina). Sem esta variável em produção a vitrine fica
      # permanentemente vazia, e o painel só consegue reportar "a lista de mesas
      # está indisponível" — sem nada no log que aponte para CORS.
      - key: CORS_ORIGINS
        sync: false
