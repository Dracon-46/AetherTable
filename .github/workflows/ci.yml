# ─────────────────────────────────────────────────────────────────────────────
# CI do AetherTable.
#
# `.github/workflows/` existia VAZIO: nenhuma verificação automática rodava em
# push ou pull request. Os defeitos encontrados na auditoria de 31/08 eram
# todos detectáveis por máquina:
#
#   - `next build` quebrado (useSearchParams sem Suspense) → job `build-e2e`;
#   - mirror de schema Colyseus fora de sincronia → `schema:check`;
#   - hooks condicionais derrubando a mesa → `lint` (react-hooks/rules-of-hooks);
#   - intenções que o cliente emitia e o servidor não conhecia → `test`.
#
# ─── POR QUE TRÊS JOBS, E NÃO UM ────────────────────────────────────────────
#
# Era um job só, em fila: um lint quebrado escondia o resultado dos testes, e um
# teste do backend falhando só aparecia depois de 15 minutos de passos que nada
# tinham a ver com ele. Agora:
#
#   qualidade  — o que é barato e pega muita coisa (formatação, schema,
#                paridade de intenções, lint, typecheck);
#   testes     — um job POR APP, em paralelo: a falha diz de qual app é, e um
#                app não espera o outro;
#   build-e2e  — o build de produção e as telas públicas no Chromium.
#
# Os três rodam ao mesmo tempo; o PR só fica verde com os três.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    # `develop` entra junto com `main` porque as duas sao eternas e as duas
    # precisam estar sempre verdes. `release/*` e `hotfix/*` porque e la que a
    # estabilizacao acontece. `feature/*` e `fix/*` porque uma branch de
    # trabalho so era verificada quando virava PR — e subir para ver o CI antes
    # de abrir o PR era impossivel.
    branches: [main, develop, 'release/**', 'hotfix/**', 'feature/**', 'fix/**']
  pull_request:
  # Botão "Run workflow" na aba Actions, para rodar sob demanda.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade (formatação, schema, lint, tipos)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # O historico e preciso para varrer as mensagens dos commits que
          # chegaram. Com o clone raso padrao (depth 1) so existe um commit, e
          # a checagem de atribuicao passaria sem olhar nada.
          fetch-depth: 0

      - name: Nenhuma atribuicao a ferramenta nas mensagens
        # Ultima rede. O `commit-msg` barra ao escrever e o `pre-push` ao
        # subir, mas os dois sao locais e puláveis com `--no-verify`; aqui nao
        # ha como pular. Ver DOC-091 §5 para por que a regra existe.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "Verificando $RANGE"
          node tools/sem-atribuicao-de-ia.mjs --range "$RANGE"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar o Prisma Client
        run: pnpm --filter backend-core exec prisma generate

      - name: Compilar pacotes compartilhados
        # O frontend e o game-server importam `@aethertable/shared-types` pelo
        # `dist`. Sem este passo, typecheck e testes falham por módulo ausente.
        run: pnpm --filter @aethertable/shared-types --filter @aethertable/scryfall-client build

      - name: Mirror de schema Colyseus em sincronia
        # Falha se apps/frontend/src/net/schema divergir do game-server. Esta é
        # a verificação mais barata do pipeline e a que protege contra o bug
        # mais caro: divergência de índice de campo corrompe o state inteiro
        # sem emitir um único erro em runtime.
        run: pnpm schema:check

      - name: Formatacao
        # Diff de formatacao some no meio de diff de conteudo, e revisor humano
        # gasta atencao com ele. O `pre-commit` ja formata o que esta staged;
        # este passo pega o que entrou por outro caminho.
        run: pnpm format:check

      - name: Paridade de intencoes
        # Intencao que o cliente emite e o servidor nao conhece e descartada em
        # SILENCIO pelo Colyseus — nao ha erro para o teste pegar. Esta
        # ferramenta compara contrato, REGISTRY e emissores.
        run: pnpm docs:estado

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  testes:
    name: Testes — ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Um app vermelho não cancela os outros: o relatório completo de uma vez
      # é o que poupa a segunda volta de push.
      fail-fast: false
      matrix:
        app: [backend-core, game-server, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar o Prisma Client
        if: matrix.app == 'backend-core'
        run: pnpm --filter backend-core exec prisma generate

      - name: Compilar pacotes compartilhados
        run: pnpm --filter @aethertable/shared-types --filter @aethertable/scryfall-client build

      - name: Jest
        # `--ci` faz snapshot ausente falhar em vez de ser gravado. Dois
        # workers: o runner tem 4 núcleos e o jsdom do frontend é pesado — com
        # o padrão, os workers disputavam memória e o jest morria sem relatório.
        run: pnpm --filter ${{ matrix.app }} test -- --ci --maxWorkers=2

  build-e2e:
    name: Build e E2E das telas públicas
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar o Prisma Client
        run: pnpm --filter backend-core exec prisma generate

      - name: Build
        run: pnpm build

      - name: Instalar o Chromium do Playwright
        # `--with-deps` traz as bibliotecas de sistema que o Chromium headless
        # precisa no runner do GitHub. Só o Chromium: a suíte roda os dois
        # perfis (Desktop Chrome e Pixel 7) sobre o mesmo motor.
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: E2E das telas públicas
        # Reaproveita o build do passo anterior: o `webServer` do
        # playwright.config.ts sobe `next start` na 3210. A suíte cobre o que
        # roda sem banco e sem os dois serviços — renderização, ausência de
        # estouro horizontal, erros de página e roteamento entre login e
        # cadastro.
        run: pnpm --filter frontend test:e2e

      - name: Guardar o relatório do E2E quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7
