# ─────────────────────────────────────────────────────────────────────────────
# CI do AetherTable.
#
# `.github/workflows/` já existiu VAZIO: nenhuma verificação automática rodava
# em push ou pull request. Os defeitos encontrados na auditoria de 31/08 eram
# todos detectáveis por máquina:
#
#   - `next build` quebrado (useSearchParams sem Suspense) → job `build-e2e`;
#   - mirror de schema Colyseus fora de sincronia → `schema:check`;
#   - hooks condicionais derrubando a mesa → `lint` (react-hooks/rules-of-hooks);
#   - intenções que o cliente emitia e o servidor não conhecia → `test`.
#
# ─── OS JOBS ────────────────────────────────────────────────────────────────
#
#   atribuicao — mensagens de commit sem atribuição a ferramenta (DOC-091 §5);
#   qualidade  — o que é barato e pega muita coisa (formatação, schema,
#                paridade de intenções, lint com tipos, typecheck);
#   testes     — um job POR PACOTE, em paralelo: a falha diz de qual pacote
#                é, e um não espera o outro;
#   build-e2e  — o build de produção e as telas públicas no Chromium;
#   docker     — as imagens do Render construídas de verdade. O `pnpm deploy`
#                do Dockerfile já quebrou um deploy com o CI verde, porque
#                nada aqui construía a imagem;
#   ci-ok      — o único check que a proteção de branch precisa exigir. A
#                matriz de testes pode ganhar ou perder pacote sem ninguém
#                lembrar de atualizar a regra da branch.
#
# ─── SEGURANÇA DO PRÓPRIO PIPELINE ──────────────────────────────────────────
#
#   - `permissions: contents: read` — o GITHUB_TOKEN deixa de herdar o padrão
#     do repositório. Nenhum job aqui escreve nada.
#   - `persist-credentials: false` — o checkout não deixa o token no
#     `.git/config`, onde um `postinstall` comprometido no `pnpm install` o
#     leria.
#   - Actions de terceiros fixadas por SHA, não por tag: tag é móvel, e uma
#     tag sequestrada roda código arbitrário com o token do repositório. O
#     Dependabot mantém os SHAs atualizados (ver .github/dependabot.yml).
#   - Nada de `${{ github.event... }}` interpolado dentro de `run:` — vai por
#     `env:`, que o shell trata como dado, nunca como código.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    # `develop` entra junto com `main` porque as duas sao eternas e as duas
    # precisam estar sempre verdes. `release/*` e `hotfix/*` porque e la que a
    # estabilizacao acontece. `feature/*` e `fix/*` porque uma branch de
    # trabalho so era verificada quando virava PR — e subir para ver o CI antes
    # de abrir o PR era impossivel.
    branches: [main, develop, 'release/**', 'hotfix/**', 'feature/**', 'fix/**']
    paths-ignore: ['docs/wiki/**']
  pull_request:
  # Botão "Run workflow" na aba Actions, para rodar sob demanda.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Um push novo na mesma branch (ou no mesmo PR) cancela a execução anterior.
  # Na `main` não: cada commit dela é um release, e o resultado de cada um
  # precisa ficar registrado.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  atribuicao:
    name: Mensagens de commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # O historico e preciso para varrer as mensagens dos commits que
          # chegaram. Com o clone raso padrao (depth 1) so existe um commit, e
          # a checagem passaria sem olhar nada.
          fetch-depth: 0

      - name: Nenhuma atribuicao a ferramenta nas mensagens
        # Ultima rede. O `commit-msg` barra ao escrever e o `pre-push` ao
        # subir, mas os dois sao locais e puláveis com `--no-verify`; aqui nao
        # ha como pular. Ver DOC-091 §5 para por que a regra existe.
        env:
          EVENTO: ${{ github.event_name }}
          BASE_DO_PR: ${{ github.event.pull_request.base.sha }}
          TOPO_DO_PR: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
          PADRAO: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            RANGE="$BASE_DO_PR..$TOPO_DO_PR"
          elif [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
            # Primeiro push de uma branch nova: o `before` vem zerado, e o
            # intervalo invalido fazia a checagem sair limpa sem olhar nada.
            RANGE="origin/$PADRAO..$DEPOIS"
          else
            RANGE="$ANTES..$DEPOIS"
          fi
          echo "Verificando $RANGE"
          node tools/sem-atribuicao-de-ia.mjs --range "$RANGE"

  qualidade:
    name: Qualidade (formatação, schema, lint, tipos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/preparar
        with:
          prisma: 'true'

      - name: Mirror de schema Colyseus em sincronia
        # Falha se apps/frontend/src/net/schema divergir do game-server. Esta é
        # a verificação mais barata do pipeline e a que protege contra o bug
        # mais caro: divergência de índice de campo corrompe o state inteiro
        # sem emitir um único erro em runtime.
        run: pnpm schema:check

      - name: Formatação
        # Diff de formatacao some no meio de diff de conteudo, e revisor humano
        # gasta atencao com ele. O `pre-commit` ja formata o que esta staged;
        # este passo pega o que entrou por outro caminho.
        run: pnpm format:check

      - name: Paridade de intenções
        # Intencao que o cliente emite e o servidor nao conhece e descartada em
        # SILENCIO pelo Colyseus — nao ha erro para o teste pegar. Esta
        # ferramenta compara contrato, REGISTRY e emissores.
        run: pnpm docs:estado

      - name: Lint (com tipos, zero aviso)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  testes:
    name: Testes — ${{ matrix.pacote }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Um pacote vermelho não cancela os outros: o relatório completo de uma
      # vez é o que poupa a segunda volta de push.
      fail-fast: false
      matrix:
        pacote: [backend-core, game-server, frontend, '@aethertable/scryfall-client']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/preparar
        with:
          prisma: ${{ matrix.pacote == 'backend-core' }}

      - name: Jest
        # `--ci` faz snapshot ausente falhar em vez de ser gravado. Dois
        # workers: o runner tem 4 núcleos e o jsdom do frontend é pesado — com
        # o padrão, os workers disputavam memória e o jest morria sem relatório.
        env:
          PACOTE: ${{ matrix.pacote }}
        run: pnpm --filter "$PACOTE" test -- --ci --maxWorkers=2

  build-e2e:
    name: Build e E2E das telas públicas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/preparar
        with:
          prisma: 'true'
          # O `pnpm build` do turbo compila os pacotes na ordem certa.
          pacotes: 'false'

      - name: Build
        run: pnpm build

      - name: Instalar o Chromium do Playwright
        # `--with-deps` traz as bibliotecas de sistema que o Chromium headless
        # precisa no runner do GitHub. Só o Chromium: a suíte roda os dois
        # perfis (Desktop Chrome e Pixel 7) sobre o mesmo motor.
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: E2E das telas públicas
        # Reaproveita o build do passo anterior: o `webServer` do
        # playwright.config.ts sobe `next start` na 3210. A suíte cobre o que
        # roda sem banco e sem os dois serviços — renderização, ausência de
        # estouro horizontal, erros de página e roteamento entre login e
        # cadastro.
        run: pnpm --filter frontend test:e2e

      - name: Guardar o relatório do E2E quando falhar
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7

  docker:
    name: Imagem — ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [backend-core, game-server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir a imagem de produção
        # O contexto é a RAIZ do monorepo, igual ao Render. A imagem não é
        # publicada: o que interessa é o build passar.
        env:
          APP: ${{ matrix.app }}
        run: docker build --file "apps/$APP/Dockerfile" --tag "aethertable-$APP:ci" .

  ci-ok:
    name: CI ok
    if: always()
    needs: [atribuicao, qualidade, testes, build-e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Todos os jobs passaram
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            [ "$r" = "success" ] || { echo "::error::algum job terminou em '$r'"; exit 1; }
          done
